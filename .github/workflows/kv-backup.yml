# Nightly KV backup.
#
# Every trace of ZABAL Gamez Season 1 lives only in Upstash KV. This pulls the whole
# keyspace through /api/export and commits it, so the repo always holds a restorable
# copy and the vendor stops being a single point of failure.
#
# Requires one repo secret: ADMIN_KEY (the same value api/../lib/auth.mjs accepts).
name: KV backup

on:
  schedule:
    - cron: '20 5 * * *' # 05:20 UTC daily, well clear of deploy traffic
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the export
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          set -o pipefail
          if [ -z "$ADMIN_KEY" ]; then
            echo "ADMIN_KEY secret is not set - refusing to write an empty backup."
            exit 1
          fi
          mkdir -p backups
          CODE=$(curl -sS -o /tmp/export.json -w '%{http_code}' \
            -H "Authorization: Bearer $ADMIN_KEY" \
            "https://zabalgamez.com/api/export")
          echo "HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Export did not return 200. Not writing a backup."
            head -c 400 /tmp/export.json || true
            exit 1
          fi

      - name: Verify the export is real before committing it
        run: |
          # A backup that is syntactically fine but empty is the failure mode that
          # matters - it looks green for months and restores nothing.
          python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/export.json'))
          if not d.get('ok'):
              sys.exit('export reported ok=false: %s' % d.get('error'))
          n = d.get('count') or 0
          if d.get('truncated'):
              sys.exit('export was truncated at the key cap - it is incomplete by definition')
          keys = d.get('data') or {}

          # Assert the SHAPE, not a floor. A floor of 20 passed a backup that was
          # missing a third of the submissions; only comparing against the index
          # catches a partial export.
          need = ['zabal:subs:recent', 'zabal:subs:counter']
          missing = [k for k in need if k not in keys]
          if missing:
              sys.exit('missing structural key(s): %s' % missing)

          # zabal:subs:recent is the index of every submission id. Every id it lists
          # must have its document in the backup, or the backup restores an index
          # pointing at nothing.
          index = keys.get('zabal:subs:recent') or []
          ids = [index[i] for i in range(0, len(index), 2)] if index and not isinstance(index[0], dict) else []
          docs = {k.split(':')[-1] for k in keys if k.startswith('zabal:sub:v1:')}
          orphans = [i for i in ids if str(i) not in docs]
          if orphans:
              sys.exit('%d id(s) in zabal:subs:recent have no document: %s' % (len(orphans), orphans[:5]))
          print('submissions: %d indexed, %d documents, 0 orphans' % (len(ids), len(docs)))

          # The ballots are the only irreplaceable per-person data. Their absence is
          # worth failing on, because nothing else records who voted for what.
          if not any(k.startswith('qv:tally:') for k in keys):
              sys.exit('no qv:tally:* keys - the ballot history is not in this backup')

          # points:tally only exists once a point has been awarded. Absence is normal
          # BEFORE the first award and alarming after it, so say which this is.
          if 'zabal:points:tally' in keys:
              print('points board: present')
          else:
              print('points board: absent - normal until the first award is made')

          print('export ok: %d keys, types=%s' % (n, d.get('types')))
          PY

      - name: Write and commit
        run: |
          python3 -c "
          import json
          d = json.load(open('/tmp/export.json'))
          json.dump(d, open('backups/kv-latest.json','w'), indent=1, sort_keys=True)
          "
          git config user.name  "zao-backup"
          git config user.email "info@thezao.com"
          # Stage FIRST, then compare the index. `git diff` against an untracked file
          # reports no change and exits 0, so the original could never make its own
          # first commit - it reported success while committing nothing.
          git add backups/kv-latest.json
          if git diff --cached --quiet -- backups/kv-latest.json; then
            echo "No change since the last backup."
            exit 0
          fi
          git commit -m "chore(backup): nightly KV export"
          git push
